project_name: "EasyBacklog"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
definition_of_done: ["仅修改文档时核对变更内容及涉及的链接和示例，跳过代码检查和测试。", "改动 TypeScript 源码、类型声明或类型检查配置时，通过 bun run check:types。", "改动 Biome 覆盖的文件时，对变更文件运行 bunx biome check；改动 Biome 规则时运行 bun run check。", "改动代码行为或测试时，通过受影响的测试；跨模块且影响范围难以界定时，通过 bun run test 全量测试。"]
date_format: yyyy-mm-dd hh:mm
max_column_width: 20
default_editor: "rider"
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 10
task_prefix: "back"
